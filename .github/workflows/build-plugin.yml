name: Build Plugin Jar

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Compile plugin
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar -PBuildFull=false --no-daemon

      - name: Upload compiled plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: dominion-plugin-jar
          path: build/libs/*-lite.jar
          if-no-files-found: error
          retention-days: 14
